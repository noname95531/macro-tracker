<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日飲食營養追蹤器</title>
  <!-- 引入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 p-4 md:p-8">
  <div class="max-w-4xl mx-auto space-y-6">
    
    <header class="text-center">
      <h1 class="text-3xl font-bold text-blue-600">每日飲食營養追蹤器</h1>
      <p class="text-gray-500 text-sm mt-1">輕鬆記錄三大營養素，掌握飲食目標</p>
    </header>

    <!-- 每日目標與當前進度卡片 -->
    <section class="bg-white p-6 rounded-xl shadow-md">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold text-gray-700">今日攝取與目標</h2>
        <button onclick="toggleGoalForm()" class="text-sm bg-gray-200 hover:bg-gray-300 px-3 py-1 rounded transition">設定目標</button>
      </div>

      <!-- 設定目標表單 (預設隱藏) -->
      <form id="goal-form" onsubmit="saveGoals(event)" class="hidden mb-6 p-4 bg-gray-50 rounded-lg grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">目標蛋白質 (g)</label>
          <input type="number" id="goal-p" min="0" step="0.1" class="w-full border p-2 rounded" required>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">目標碳水 (g)</label>
          <input type="number" id="goal-c" min="0" step="0.1" class="w-full border p-2 rounded" required>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">目標脂肪 (g)</label>
          <input type="number" id="goal-f" min="0" step="0.1" class="w-full border p-2 rounded" required>
        </div>
        <div class="md:col-span-3 text-right">
          <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">儲存目標</button>
        </div>
      </form>

      <!-- 營養素進度條與差距 -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- 蛋白質 -->
        <div class="p-4 bg-blue-50 rounded-lg border border-blue-100">
          <div class="flex justify-between items-center mb-1">
            <span class="font-bold text-blue-700">蛋白質</span>
            <span id="text-p" class="text-sm font-semibold">0 / 0 g</span>
          </div>
          <div class="w-full bg-blue-200 h-3 rounded-full overflow-hidden">
            <div id="bar-p" class="bg-blue-600 h-full w-0 transition-all duration-300"></div>
          </div>
          <p id="diff-p" class="text-xs text-gray-500 mt-2">差距：-</p>
        </div>

        <!-- 碳水化合物 -->
        <div class="p-4 bg-green-50 rounded-lg border border-green-100">
          <div class="flex justify-between items-center mb-1">
            <span class="font-bold text-green-700">碳水化合物</span>
            <span id="text-c" class="text-sm font-semibold">0 / 0 g</span>
          </div>
          <div class="w-full bg-green-200 h-3 rounded-full overflow-hidden">
            <div id="bar-c" class="bg-green-600 h-full w-0 transition-all duration-300"></div>
          </div>
          <p id="diff-c" class="text-xs text-gray-500 mt-2">差距：-</p>
        </div>

        <!-- 脂肪 -->
        <div class="p-4 bg-yellow-50 rounded-lg border border-yellow-100">
          <div class="flex justify-between items-center mb-1">
            <span class="font-bold text-yellow-700">脂肪</span>
            <span id="text-f" class="text-sm font-semibold">0 / 0 g</span>
          </div>
          <div class="w-full bg-yellow-200 h-3 rounded-full overflow-hidden">
            <div id="bar-f" class="bg-yellow-500 h-full w-0 transition-all duration-300"></div>
          </div>
          <p id="diff-f" class="text-xs text-gray-500 mt-2">差距：-</p>
        </div>
      </div>
    </section>

    <!-- 區塊：新增每日飲食紀錄與當日明細 -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      
      <!-- 記錄今日飲食 -->
      <section class="bg-white p-6 rounded-xl shadow-md">
        <h2 class="text-xl font-bold text-gray-700 mb-4">記錄今日飲食</h2>
        <form onsubmit="addLog(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">選擇食物</label>
            <select id="log-food-select" class="w-full border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" required>
              <option value="">-- 請選擇食物 --</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">攝取份量 (克)</label>
            <input type="number" id="log-weight" min="1" step="1" placeholder="例如：150" class="w-full border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" required>
          </div>
          <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-2 rounded hover:bg-blue-700 transition">加入今日紀錄</button>
        </form>
      </section>

      <!-- 食物資料庫管理 -->
      <section class="bg-white p-6 rounded-xl shadow-md">
        <h2 class="text-xl font-bold text-gray-700 mb-4">新增食物至資料庫 (每 100g 數值)</h2>
        <form onsubmit="addFood(event)" class="space-y-3">
          <input type="text" id="food-name" placeholder="食物名稱 (例: 雞胸肉)" class="w-full border p-2 rounded" required>
          <div class="grid grid-cols-3 gap-2">
            <input type="number" id="food-p" min="0" step="0.1" placeholder="蛋白(g)" class="border p-2 rounded" required>
            <input type="number" id="food-c" min="0" step="0.1" placeholder="碳水(g)" class="border p-2 rounded" required>
            <input type="number" id="food-f" min="0" step="0.1" placeholder="脂肪(g)" class="border p-2 rounded" required>
          </div>
          <button type="submit" class="w-full bg-gray-800 text-white font-semibold py-2 rounded hover:bg-gray-900 transition">新增食物</button>
        </form>
      </section>

    </div>

    <!-- 今日已吃食物列表 -->
    <section class="bg-white p-6 rounded-xl shadow-md">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold text-gray-700">今日飲食明細</h2>
        <button onclick="clearDailyLogs()" class="text-xs bg-red-100 text-red-600 hover:bg-red-200 px-3 py-1 rounded">清空今日紀錄</button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-gray-600">
          <thead class="bg-gray-50 border-b">
            <tr>
              <th class="p-2">食物</th>
              <th class="p-2">重量</th>
              <th class="p-2">蛋白質</th>
              <th class="p-2">碳水</th>
              <th class="p-2">脂肪</th>
              <th class="p-2">操作</th>
            </tr>
          </thead>
          <tbody id="log-list">
            <!-- 動態渲染 -->
          </tbody>
        </table>
      </div>
    </section>

  </div>

  <script>
    // 預設內置食物資料庫
    const defaultFoods = [
      { id: '1', name: '牛肉（瘦牛肉）', p: 21.0, c: 0, f: 7.0 },
      { id: '2', name: '雞肉（去皮雞胸）', p: 22.5, c: 0, f: 2.6 },
      { id: '3', name: '三文魚（養殖大西洋）', p: 20.4, c: 0, f: 13.4 },
      { id: '4', name: '鯖魚', p: 19.0, c: 0, f: 13.9 },
      { id: '5', name: '全蛋', p: 12.6, c: 0.7, f: 9.5 },
      { id: '6', name: '全脂牛奶', p: 3.2, c: 4.8, f: 3.3 },
      { id: '7', name: '番茄', p: 0.9, c: 3.9, f: 0.2 },
      { id: '8', name: '西蘭花', p: 2.8, c: 6.6, f: 0.4 },
      { id: '9', name: '菠菜', p: 2.9, c: 3.6, f: 0.4 },
      { id: '10', name: '胡蘿蔔', p: 0.9, c: 9.6, f: 0.2 },
      { id: '11', name: '奇異果', p: 1.1, c: 14.7, f: 0.5 },
      { id: '12', name: '香蕉', p: 1.1, c: 22.8, f: 0.3 },
      { id: '13', name: '橙', p: 0.9, c: 11.8, f: 0.1 },
      { id: '14', name: '藍莓', p: 0.7, c: 14.5, f: 0.3 },
      { id: '15', name: '牛油果', p: 2.0, c: 8.5, f: 14.7 },
      { id: '16', name: '燕麥（乾）', p: 16.9, c: 66.3, f: 6.9 },
      { id: '17', name: '地瓜（熟）', p: 2.0, c: 20.7, f: 0.2 },
      { id: '18', name: '馬鈴薯（水煮）', p: 1.9, c: 20.1, f: 0.1 },
      { id: '19', name: '白飯（熟）', p: 2.7, c: 28.2, f: 0.3 },
      { id: '20', name: '白米（生）', p: 7.1, c: 80.0, f: 0.7 }
    ];

    // 初始化 LocalStorage 資料
    let foods = JSON.parse(localStorage.getItem('foods')) || defaultFoods;
    let goals = JSON.parse(localStorage.getItem('goals')) || { p: 140, c: 200, f: 50 };
    let dailyLogs = JSON.parse(localStorage.getItem('dailyLogs')) || [];

    function saveAll() {
      localStorage.setItem('foods', JSON.stringify(foods));
      localStorage.setItem('goals', JSON.stringify(goals));
      localStorage.setItem('dailyLogs', JSON.stringify(dailyLogs));
    }

    // 渲染食物下拉選單
    function renderFoodSelect() {
      const select = document.getElementById('log-food-select');
      select.innerHTML = '<option value="">-- 請選擇食物 --</option>';
      foods.forEach(food => {
        select.innerHTML += `<option value="${food.id}">${food.name} (每100g: P:${food.p}g / C:${food.c}g / F:${food.f}g)</option>`;
      });
    }

    // 切換目標表單顯示
    function toggleGoalForm() {
      const form = document.getElementById('goal-form');
      form.classList.toggle('hidden');
      document.getElementById('goal-p').value = goals.p;
      document.getElementById('goal-c').value = goals.c;
      document.getElementById('goal-f').value = goals.f;
    }

    // 儲存目標
    function saveGoals(e) {
      e.preventDefault();
      goals.p = parseFloat(document.getElementById('goal-p').value) || 0;
      goals.c = parseFloat(document.getElementById('goal-c').value) || 0;
      goals.f = parseFloat(document.getElementById('goal-f').value) || 0;
      saveAll();
      toggleGoalForm();
      updateUI();
    }

    // 新增食物到資料庫
    function addFood(e) {
      e.preventDefault();
      const name = document.getElementById('food-name').value;
      const p = parseFloat(document.getElementById('food-p').value) || 0;
      const c = parseFloat(document.getElementById('food-c').value) || 0;
      const f = parseFloat(document.getElementById('food-f').value) || 0;

      foods.push({ id: Date.now().toString(), name, p, c, f });
      saveAll();
      renderFoodSelect();

      document.getElementById('food-name').value = '';
      document.getElementById('food-p').value = '';
      document.getElementById('food-c').value = '';
      document.getElementById('food-f').value = '';
    }

    // 新增攝取紀錄
    function addLog(e) {
      e.preventDefault();
      const foodId = document.getElementById('log-food-select').value;
      const weight = parseFloat(document.getElementById('log-weight').value);
      const food = foods.find(f => f.id === foodId);

      if (!food || !weight) return;

      const log = {
        id: Date.now().toString(),
        name: food.name,
        weight: weight,
        p: (food.p * weight) / 100,
        c: (food.c * weight) / 100,
        f: (food.f * weight) / 100
      };

      dailyLogs.push(log);
      saveAll();
      updateUI();

      document.getElementById('log-weight').value = '';
    }

    // 刪除單筆紀錄
    function deleteLog(id) {
      dailyLogs = dailyLogs.filter(log => log.id !== id);
      saveAll();
      updateUI();
    }

    // 清空今日紀錄
    function clearDailyLogs() {
      if (confirm('確定要清空今日的所有攝取紀錄嗎？')) {
        dailyLogs = [];
        saveAll();
        updateUI();
      }
    }

    // 更新界面（計算總和、差距、進度條）
    function updateUI() {
      let totalP = 0, totalC = 0, totalF = 0;
      const tbody = document.getElementById('log-list');
      tbody.innerHTML = '';

      dailyLogs.forEach(log => {
        totalP += log.p;
        totalC += log.c;
        totalF += log.f;

        tbody.innerHTML += `
          <tr class="border-b">
            <td class="p-2 font-medium">${log.name}</td>
            <td class="p-2">${log.weight}g</td>
            <td class="p-2 text-blue-600">${log.p.toFixed(1)}g</td>
            <td class="p-2 text-green-600">${log.c.toFixed(1)}g</td>
            <td class="p-2 text-yellow-600">${log.f.toFixed(1)}g</td>
            <td class="p-2">
              <button onclick="deleteLog('${log.id}')" class="text-red-500 hover:underline text-xs">刪除</button>
            </td>
          </tr>
        `;
      });

      // 更新進度與文字
      updateNutrientUI('p', totalP, goals.p);
      updateNutrientUI('c', totalC, goals.c);
      updateNutrientUI('f', totalF, goals.f);
    }

    function updateNutrientUI(type, total, goal) {
      document.getElementById(`text-${type}`).innerText = `${total.toFixed(1)} / ${goal} g`;
      const percentage = goal > 0 ? Math.min((total / goal) * 100, 100) : 0;
      document.getElementById(`bar-${type}`).style.width = `${percentage}%`;

      const diff = total - goal;
      const diffEl = document.getElementById(`diff-${type}`);
      if (diff >= 0) {
        diffEl.innerText = `已達標 (超出 ${diff.toFixed(1)}g)`;
        diffEl.className = 'text-xs mt-2 font-semibold text-green-600';
      } else {
        diffEl.innerText = `還差 ${Math.abs(diff).toFixed(1)}g 達標`;
        diffEl.className = 'text-xs mt-2 font-semibold text-red-500';
      }
    }

    // 初始化執行
    renderFoodSelect();
    updateUI();
  </script>
</body>
</html>
